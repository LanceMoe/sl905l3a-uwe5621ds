name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: 'Optional custom release; supply all three kernel fields together'
        type: string
      kernel_url:
        description: 'HTTPS URL for matching prepared ophub headers (standalone or kernel bundle)'
        type: string
      kernel_sha256:
        description: 'SHA-256 of the downloaded archive'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 git kmod shellcheck golang-go
      - name: Validate version tag before building a release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate-tag --tag "$RELEASE_TAG"
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Check scripts
        run: bash scripts/check.sh
      - name: Regression tests
        run: |
          mkdir -p dist
          bash scripts/run-tests.sh 2>&1 | tee dist/tests.log
      - name: Package source and integration update
        run: |
          python3 scripts/package.py --kind source
          python3 scripts/package.py --kind integration
      - name: Upload source and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-and-tests
          path: |
            dist/*-source.tar.gz*
            dist/*-integration.tar.gz*
            dist/tests.log
          if-no-files-found: error
          retention-days: 14

  arm64-build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      kernel_release: ${{ steps.headers.outputs.kernel_release }}
    env:
      CI_KERNEL_RELEASE: ${{ inputs.kernel_release || vars.CI_KERNEL_RELEASE }}
      CI_KERNEL_URL: ${{ inputs.kernel_url || vars.CI_KERNEL_URL }}
      CI_KERNEL_SHA256: ${{ inputs.kernel_sha256 || vars.CI_KERNEL_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 git curl xz-utils kmod
      - name: Fetch checksum-pinned compiler
        run: bash scripts/fetch-toolchain.sh
      - name: Prepare verified headers and native host tools
        id: headers
        run: python3 ci/prepare-headers.py
      - name: Cross-compile both ARM64 modules
        run: |
          export CROSS_COMPILE="$PWD/.cache/toolchain/bin/aarch64-none-linux-gnu-"
          JOBS=2 bash scripts/build.sh
      - name: Package matching modules with corresponding source
        run: python3 scripts/package.py --kind modules --kernel-release "$KERNEL_RELEASE"
      - name: Upload kernel-specific build and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-modules-${{ env.KERNEL_RELEASE || 'unprepared' }}
          path: |
            dist/*-6.18*.tar.gz*
            dist/*/build.log
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, arm64-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 kmod gh
      - name: Download source artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-and-tests
          path: release-input/source
      - name: Download matching binary artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arm64-modules-${{ needs.arm64-build.outputs.kernel_release }}
          path: release-input/modules
      - name: Verify artifacts and generate binary-aware release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BINARY_KERNEL: ${{ needs.arm64-build.outputs.kernel_release }}
        run: |
          python3 scripts/release.py prepare --tag "$RELEASE_TAG" \
            --kernel-release "$BINARY_KERNEL" --inputs release-input --output release-assets
      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --output release-assets
